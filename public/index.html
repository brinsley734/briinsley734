<!DOCTYPE html>
<html>
<head>
    <title>Brins Money Tracker</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #eef2f3; color: #333; }
        .dashboard { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto; }
        .balance-box { background: #2ecc71; color: white; padding: 15px; border-radius: 8px; text-align: center; font-size: 1.5rem; margin-bottom: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .row-inputs { display: flex; gap: 10px; }
        input, select { padding: 10px; border: 1px solid #ccc; border-radius: 5px; flex: 1; font-size: 1rem; }
        button { background: #3498db; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 1rem; }
        button:hover { background: #2980b9; }
        
        .expense-item { display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; padding: 10px; margin: 5px 0; border-radius: 5px; border-left: 5px solid #e74c3c; }
        
        /* Category Badges Styling */
        .badge { padding: 3px 8px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; color: white; margin-left: 10px; }
        .cat-Food { background-color: #f39c12; }
        .cat-Transport { background-color: #9b59b6; }
        .cat-Entertainment { background-color: #e74c3c; }
        .cat-Bills { background-color: #34495e; }
        .cat-Other { background-color: #7f8c8d; }

        .delete-btn { background: none; color: #95a5a6; border: none; padding: 0 5px; font-size: 1.2rem; cursor: pointer; }
        .delete-btn:hover { color: #c0392b; }
        .left-content { display: flex; align-items: center; }
    </style>
</head>
<body>

    <div class="dashboard">
        <h2>Total Cash Spent 💸</h2>
        <div class="balance-box">Total: $<span id="totalDisplay">0.00</span></div>

        <div class="input-group">
            <div class="row-inputs">
                <input id="itemName" type="text" placeholder="What did you buy?">
                <input id="itemAmount" type="number" step="0.01" placeholder="Cost ($)">
            </div>
            <div class="row-inputs">
                <select id="itemCategory">
                    <option value="Food">🍔 Food</option>
                    <option value="Transport">🚗 Transport</option>
                    <option value="Entertainment">🎬 Entertainment</option>
                    <option value="Bills">🔌 Bills</option>
                    <option value="Other">📦 Other</option>
                </select>
                <button onclick="addExpense()">Add Expense</button>
            </div>
        </div>

        <div id="expensesList"></div>
    </div>

    <script>
        // Fetch and show expenses when page loads or updates
        async function loadExpenses() {
            const response = await fetch('/api/expenses');
            const data = await response.json(); 
            
            document.getElementById('totalDisplay').innerText = data.total.toFixed(2);

            const listDisplay = document.getElementById('expensesList');
            listDisplay.innerHTML = data.list.map(exp => `
                <div class="expense-item">
                    <div class="left-content">
                        <strong>${exp.item}</strong>
                        <span class="badge cat-${exp.category}">${exp.category}</span>
                    </div>
                    <div>
                        <span style="margin-right: 15px;">$${exp.amount.toFixed(2)}</span>
                        <button class="delete-btn" onclick="deleteExpense(${exp.id})">❌</button>
                    </div>
                </div>
            `).join('');
        }

        // Send a new expense to the backend
        async function addExpense() {
            const nameInput = document.getElementById('itemName');
            const amountInput = document.getElementById('itemAmount');
            const categoryInput = document.getElementById('itemCategory');

            const name = nameInput.value.trim();
            const amount = amountInput.value.trim();
            const category = categoryInput.value;

            if (!name || !amount) {
                alert('Please enter both an item and a cost!');
                return;
            }

            const response = await fetch('/api/expenses', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    item: name,
                    amount: parseFloat(amount),
                    category: category
                })
            });

            if (!response.ok) {
                const text = await response.text();
                alert(text);
                return;
            }

            nameInput.value = '';
            amountInput.value = '';
            loadExpenses();
        }

        // Delete an expense item via its unique ID
        async function deleteExpense(id) {
            const response = await fetch(`/api/expenses/${id}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                loadExpenses(); // Reload the layout map
            } else {
                alert('Failed to delete item.');
            }
        }

        // Initial fetch on application start
        loadExpenses();
    </script>
</body>
</html>
