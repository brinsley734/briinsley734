<!DOCTYPE html>
<html>
<head>
    <title>Brins Money Tracker</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #eef2f3; color: #333; }
        .dashboard { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto; }
        .balance-box { background: #2ecc71; color: white; padding: 15px; border-radius: 8px; text-align: center; font-size: 1.5rem; margin-bottom: 20px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 5px; flex: 1; }
        button { background: #3498db; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
        .expense-item { display: flex; justify-content: space-between; background: #f9f9f9; padding: 10px; margin: 5px 0; border-radius: 5px; border-left: 5px solid #e74c3c; }
    </style>
</head>
<body>

    <div class="dashboard">
        <h2>Total Cash Spent 💸</h2>
        <div class="balance-box">Total: $<span id="totalDisplay">0</span></div>

        <div class="input-group">
            <input id="itemName" type="text" placeholder="What did you buy?">
            <input id="itemAmount" type="number" placeholder="Cost ($)">
            <button onclick="addExpense()">Add</button>
        </div>

        <div id="expensesList"></div>
    </div>

    <script>
        // Fetch and show expenses when page loads or changes
        async function loadExpenses() {
            const response = await fetch('/api/expenses');
            const data = await response.json(); // Expecting: { list: [...], total: X }
            
            // Display the total sum calculated by the server
            document.getElementById('totalDisplay').innerText = data.total.toFixed(2);

            // Render the list items
            const listDisplay = document.getElementById('expensesList');
            listDisplay.innerHTML = data.list.map(exp => `
                <div class="expense-item">
                    <span><strong>${exp.item}</strong></span>
                    <span>$${exp.amount.toFixed(2)}</span>
                </div>
            `).join('');
        }

        // Send a new expense to the backend
        async function addExpense() {
            const nameInput = document.getElementById('itemName');
            const amountInput = document.getElementById('itemAmount');

            const name = nameInput.value.trim();
            const amount = amountInput.value.trim();

            if (!name || !amount) {
                alert('Please enter both an item and a cost!');
                return;
            }

            const response = await fetch('/api/expenses', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    item: name,
                    amount: parseFloat(amount)
                })
            });

            if (!response.ok) {
                const text = await response.text();
                alert(text);
                return;
            }

            // Clear inputs and refresh data
            nameInput.value = '';
            amountInput.value = '';
            loadExpenses();
        }

        // Initial load on page start
        loadExpenses();
    </script>
</body>
</html>
